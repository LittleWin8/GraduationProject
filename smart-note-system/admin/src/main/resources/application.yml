# ===============================
# 公共配置（所有环境共享）
# ===============================
server:
  port: 8080

spring:
  application:
    name: smart-note-admin
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# ===============================
# MyBatis-Plus
# ===============================
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
    mapper-locations: classpath*:com/littlewin/**/mapper/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: del_flag
      logic-delete-value: 1
      logic-not-delete-value: 0

# ===============================
# Knife4j / OpenAPI
# ===============================
knife4j:
  enable: true

# ===============================
# JWT
# ===============================
jwt:
  expire: 86400000

# ===============================
# 日志
# ===============================
logging:
  level:
    com.littlewin: debug
    org.mybatis: debug
