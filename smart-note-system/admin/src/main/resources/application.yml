# ===============================
# 服务基础配置
# ===============================
server:
  port: 8080

spring:
  application:
    name: smart-note-admin
  profiles:
    active: dev  # 开发用 dev，上线改 prod
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  servlet:
    multipart:
      max-file-size: 10MB      # 单个文件大小限制比业务限制稍大
      max-request-size: 10MB   # 整个请求大小限制

# ===============================
# MyBatis-Plus 配置
# ===============================
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
    mapper-locations: classpath*:com/littlewin/**/mapper/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: del_flag
      logic-delete-value: 1
      logic-not-delete-value: 0

# ===============================
# Knife4j / OpenAPI
# ===============================
knife4j:
  enable: true

# ===============================
# JWT 配置
# ===============================
jwt:
  secret: smart-note-secret-key
  expire: 86400000

# ===============================
# 日志级别
# ===============================
logging:
  level:
    com.littlewin: debug
    org.mybatis: debug