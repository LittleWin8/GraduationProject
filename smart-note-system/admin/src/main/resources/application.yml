# ===============================
# 服务基础配置
# ===============================
server:
  port: 8080                # 后端服务端口

spring:
  application:
    name: smart-note-admin  # 服务名，Spring Cloud 改造会用到
  profiles:
    active: dev  # 开发用 dev，上线改 prod
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8


  # ===============================
  # 数据源配置（MySQL + HikariCP）
  # ===============================
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/smart_note
      ?useSSL=false
      &allowPublicKeyRetrieval=true
      &serverTimezone=Asia/Shanghai
      &characterEncoding=utf8
    username: root           # 数据库用户名
    password: 123456         # 数据库密码

    # -------------------------------
    # HikariCP 连接池配置
    # Spring Boot 默认连接池
    # -------------------------------
    hikari:
      pool-name: HikariCP
      minimum-idle: 5        # 最小空闲连接数
      maximum-pool-size: 10  # 最大连接数（毕设足够）
      idle-timeout: 600000   # 空闲连接最大存活时间（10分钟）
      max-lifetime: 1800000  # 连接最大生命周期（30分钟）
      connection-timeout: 30000 # 获取连接超时时间（30秒）

# ===============================
# MyBatis-Plus 配置
# ===============================
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 控制台打印 SQL，开发阶段强烈建议打开
    map-underscore-to-camel-case: true
    # 数据库字段下划线 -> Java 驼峰
    mapper-locations: classpath*:com/littlewin/**/mapper/*.xml

  global-config:
    db-config:
      id-type: auto           # 主键自增
      logic-delete-field: del_flag
      logic-delete-value: 1   # 逻辑删除值
      logic-not-delete-value: 0

# ===============================
# Knife4j / OpenAPI
# ===============================
knife4j:
  enable: true

# ===============================
# JWT 配置（登录时用，先放着）
# ===============================
jwt:
  secret: smart-note-secret-key
  expire: 86400000           # token 有效期（毫秒，1 天）

# ===============================
# 微信小程序登录
# ===============================
wx:
  mp:
    app-id: ${WX_MP_APPID}   # 小程序 AppID
    secret: ${WX_MP_SECRET}  # 小程序 Secret
    dev-mode: true           # true=开发模式（启用 mock），上线前改为 false
    dev:
      mock-openid: oDevUser1234567890abc  # 开发用固定 openid

# ===============================
# 日志级别
# ===============================
logging:
  level:
    com.littlewin: debug
    org.mybatis: debug
