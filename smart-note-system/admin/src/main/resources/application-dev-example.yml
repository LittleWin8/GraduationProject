# ===============================
# 开发环境配置（示例模板）
# 使用方式：复制此文件 → 重命名为 application-dev.yml → 填入真实值
# ===============================

# -------------------------------
# MySQL 数据源
# -------------------------------
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/smart_note?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: root
    password: your_mysql_password
    hikari:
      pool-name: HikariCP
      minimum-idle: 5
      maximum-pool-size: 10
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000

  # -------------------------------
  # Redis
  # -------------------------------
  data:
    redis:
      host: localhost
      port: 6379
      password: your_redis_password
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: -1ms

# -------------------------------
# JWT
# -------------------------------
jwt:
  secret: your_jwt_secret_here

# -------------------------------
# 微信小程序
# -------------------------------
wx:
  mp:
    app-id: your_wechat_app_id
    secret: your_wechat_secret
    api:
      code2session: https://api.weixin.qq.com/sns/jscode2session

# -------------------------------
# 系统业务
# -------------------------------
system:
  user:
    default-password: 123456

# -------------------------------
# 文件上传（按 Windows / Mac / Linux 修改路径）
# -------------------------------
upload:
  local-root-path: /path/to/your/upload/folder
  user-avatar-path: user/avatar
  allowed-image-suffixes: jpg,jpeg,png,gif,webp
  max-avatar-size: 5242880
