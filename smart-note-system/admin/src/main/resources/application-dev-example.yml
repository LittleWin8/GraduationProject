# ===============================
# 数据源配置（开发环境 - 示例）
# ===============================
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/smart_note?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: root
    password: your_password_here
    hikari:
      pool-name: HikariCP
      minimum-idle: 5
      maximum-pool-size: 10
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000

# ===============================
# 微信小程序配置
# ===============================
wx:
  mp:
    app-id: your_wechat_app_id_here
    secret: your_wechat_secret_here
    api:
      code2session: https://api.weixin.qq.com/sns/jscode2session

# ===============================
# 系统业务配置
# ===============================
system:
  user:
    default-password: 123456

# ===============================
# 文件上传配置
# ===============================
upload:
  local-root-path: /path/to/your/upload/folder
  user-avatar-path: user/avatar
  allowed-image-suffixes: jpg,jpeg,png,gif,webp
  max-avatar-size: 5242880